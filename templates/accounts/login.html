
{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <h2>Customer Login</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</div>
{% endblock %}
